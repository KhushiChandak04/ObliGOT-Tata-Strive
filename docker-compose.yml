services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: development
      PORT: "8000"  # Dockerfile defaults to 8080; match the published port.
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    env_file:
      - ./backend/.env
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [api]

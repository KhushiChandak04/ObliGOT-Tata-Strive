services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      OBLIGOT_DB_PATH: /data/obligot.db
    env_file:
      - ./backend/.env
    volumes:
      - obligot_data:/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  obligot_data:
